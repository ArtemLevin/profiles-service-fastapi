[project]
name = "Online Cinema"
description = "Backend services and infrastructure for the Online Cinema streaming platform"
requires-python = ">=3.11"
dynamic = ["version"]
readme = "README.md"

[tool.black]
line-length = 100
target-version = ["py311"]
preview = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [
    "docs",
    "**/migrations",
]
src = ["services", "gateway"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501", # line length handled by black
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_unused_ignores = true
follow_imports = "silent"
ignore_missing_imports = true
namespace_packages = true
pretty = true
show_error_codes = true
mypy_path = ["services"]

[[tool.mypy.overrides]]
module = ["services.admin_panel.*"]
ignore_errors = true

